# ==============================================================================
# PERALAGAE Jewellery — Full-Stack Netlify Configuration
# Next.js 16 Storefront + Express.js Serverless API (Monorepo)
# ==============================================================================

[build]
  # Build from repository root so npm workspace packages are resolved
  base = ""
  command = "npm run build:netlify"
  publish = "apps/frontend/.next"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--include=dev --legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "apps/backend/prisma/schema.prisma",
    "apps/backend/data/hero-settings.json",
    "apps/backend/data/hero-history.json"
  ]
  external_node_modules = ["@prisma/client", ".prisma"]

# ── API & Uploads Routing ─────────────────────────────────────────────────────
# Note: Forced redirects for /api/* and /uploads/* to /.netlify/functions/api have been
# removed so that requests are seamlessly handled by Next.js rewrites in apps/frontend/next.config.ts,
# proxying directly to the external backend (Hostinger VPS / Cloudflare Tunnel) via NEXT_PUBLIC_BACKEND_URL.
